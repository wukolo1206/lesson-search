<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字主板 — 國語字音形</title>
<style>
  :root { --line:#cbd5e1; --ink:#0f172a; --muted:#64748b; --blue:#2563eb; --amber:#92400e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Microsoft JhengHei",sans-serif; color:var(--ink); background:#f8fafc; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 16px;
           display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0 12px 0 0; }
  input, select, button { font:inherit; }
  #kw { padding:6px 10px; border:1px solid var(--line); border-radius:6px; width:120px; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .panel h2 { font-size:.8rem; color:var(--muted); margin:0 0 8px; letter-spacing:.05em; }
  .bigchar { font-size:5rem; font-weight:700; text-align:center; line-height:1;
             border:2px solid var(--blue); border-radius:12px; padding:18px; background:#fff; }
  .charmeta { text-align:center; color:var(--muted); font-size:.8rem; margin-top:6px; }
  .badge-wrong { display:inline-block; background:#fef2f2; color:#991b1b; border:1px solid #fca5a5;
                 border-radius:6px; padding:2px 8px; font-size:.75rem; }
  .chip { position:relative; display:inline-flex; flex-direction:column; align-items:flex-start; justify-content:center; vertical-align:middle;
          min-height:42px; max-width:100%; border:1px solid #93c5fd; background:#eff6ff; color:#1e40af;
          border-radius:999px; padding:5px 42px 5px 12px; font-size:.9rem; margin:3px; cursor:pointer; }
  .chip:hover { background:#dbeafe; }
  .chip.sup { border-color:#fcd34d; background:#fffbeb; color:var(--amber); }
  .chip.in-basket { outline:2px solid var(--blue); }
  .chip-main { line-height:1.3; white-space:nowrap; }
  .chip-action { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:26px; height:26px;
                 display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid currentColor;
                 border-radius:50%; background:rgba(255,255,255,.8); color:inherit; font-size:.82em; font-weight:700;
                 line-height:1; cursor:pointer; }
  .chip-action:hover { background:#fff; }
  .chip-action:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
  .chip.in-basket .chip-action { background:var(--blue); border-color:var(--blue); color:#fff; }
  .publisher-source { max-width:100%; color:#a16207; font-size:.68rem; font-weight:400; line-height:1.2;
                      white-space:normal; overflow-wrap:anywhere; }
  .qcard { background:#f1f5f9; border-left:3px solid var(--blue); padding:8px 10px;
           border-radius:4px; margin-bottom:6px; font-size:.85rem; cursor:pointer; }
  .qcard.active { background:#dbeafe; border-left-color:#1d4ed8; }
  .qcard .qmeta { color:var(--muted); font-size:.72rem; }
  #basket { position:sticky; bottom:0; background:#fff; border-top:2px solid var(--blue);
            padding:10px 16px; }
  #status { padding:40px; text-align:center; color:var(--muted); }
  .btn { padding:6px 12px; border:1px solid var(--line); border-radius:6px;
         background:#fff; cursor:pointer; }
  .btn-primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .hidden { display:none; }
  .wa-overlay { position:fixed; inset:0; z-index:8500; display:flex; align-items:center; justify-content:center;
    padding:20px; background:rgba(15,23,42,.58); }
  .wa-overlay.hidden { display:none; }
  .wa-dialog { width:min(960px,100%); max-height:calc(100vh - 40px); overflow:auto; background:#fff;
    border-radius:24px; box-shadow:0 24px 70px rgba(15,23,42,.28); }
  .wa-header { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center;
    padding:18px 22px; background:#fff; border-bottom:1px solid var(--line); }
  .wa-header h2 { margin:0; }
  .wa-close { min-width:44px; min-height:44px; font-size:28px; }
  .wa-body { padding:20px 22px 24px; }
  .wa-terms { border:1px solid var(--line); border-radius:16px; padding:14px; }
  #waTermChoices { display:flex; flex-wrap:wrap; gap:10px; }
  .wa-term-choice { display:inline-flex; align-items:center; gap:8px; min-height:42px; padding:6px 12px;
    border:1px solid #bfdbfe; border-radius:999px; background:#eff6ff; }
  .wa-term-choice input { width:20px; height:20px; }
  .wa-settings,.wa-actions,.wa-version-tabs { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin-top:16px; }
  .wa-settings label { display:grid; gap:5px; font-weight:700; }
  .wa-settings select { min-height:42px; padding:7px 36px 7px 10px; }
  .wa-status { min-height:1.5em; color:#475569; }
  .wa-error { color:#b91c1c; }
  .wa-version-tabs button { min-height:42px; padding:8px 18px; border:1px solid var(--line); border-radius:999px; background:#fff; }
  .wa-version-tabs button[aria-selected="true"] { background:var(--blue); color:#fff; border-color:var(--blue); }
  #waOutput { margin-top:16px; padding:18px; border:1px solid var(--line); border-radius:16px;
    font-size:1.2rem; line-height:1.9; white-space:pre-wrap; }
  #waOutput mark { background:#fef08a; color:inherit; padding:0 .08em; }
  #waDictionary { margin-top:16px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .wa-dictionary-row { padding:10px 0; border-top:1px solid var(--line); }
  .wa-dictionary-row:first-child { border-top:0; }
  .wa-dictionary-row h3,.wa-dictionary-row p { margin:4px 0; }
  .wa-print-sheet { display:none; }
  @media (max-width:700px) {
    .wa-overlay { padding:0; }
    .wa-dialog { width:100%; height:100%; max-height:none; border-radius:0; }
    .wa-body { padding:16px; }
    .wa-settings > * { flex:1 1 140px; }
  }
  @media print {
    @page { size:A4; margin:0; }
    body.wa-print-mode > * { display:none !important; }
    body.wa-print-mode > #waPrintSheet { display:block !important; }
    #waPrintSheet {
      min-height:100vh;
      padding:16mm 18mm;
      font-size:16pt;
      line-height:2;
      color:#000;
      overflow-wrap:break-word;
    }
    #waPrintSheet h1 { margin:0 0 8mm; font-size:24pt; line-height:1.2; }
    #waPrintSheet > p { margin:0 0 10mm; font-size:12pt; line-height:1.5; }
    #waPrintSheet > div > p { margin:0 0 6mm; }
    #waPrintSheet mark { background:transparent; font-weight:700; text-decoration:underline; }
  }
  #modeTabs { position:sticky; top:0; z-index:60; display:flex; gap:6px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); }
  #modeTabs .tab { padding:6px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; }
  #modeTabs .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  #view-prep.hidden, #view-board.hidden, #view-projector.hidden { display:none; }
  #view-prep { max-width:1100px; margin:0 auto; padding:16px; }
  .prep-heading { display:flex; align-items:baseline; gap:12px; margin:4px 2px 14px; }
  .prep-heading strong { font-size:1.35rem; }
  .prep-heading span, .prep-count { color:var(--muted); font-size:.85rem; }
  .prep-filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .prep-filters select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  .prep-count { margin-bottom:10px; }
  .prep-chars { margin-top:9px; padding-top:7px; border-top:1px dashed #bfdbfe; }
  .prep-char { font-size:1.05rem; min-width:42px; min-height:42px; }
  .prep-view-tabs { display:flex; gap:8px; margin:0 0 10px; }
  /* 產練習卷 */
  .pgen-list { max-height:52vh; overflow:auto; }
  .pgen-q { display:flex; gap:10px; align-items:center; padding:5px 4px; border-bottom:1px solid #eef2f7; cursor:pointer; }
  .pgen-q:last-child { border-bottom:0; }
  .pgen-q:hover { background:#f8fafc; }
  .pgen-q input { flex:0 0 auto; width:18px; height:18px; }
  /* 題目與字組同一行，一頁才看得到夠多題 */
  .pgen-q-body { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; min-width:0; }
  .pgen-q-title { font-size:14px; }
  .pgen-q-chips { display:inline-flex; flex-wrap:wrap; gap:4px; }
  .pgen-q-chips .chip { font-size:12px; padding:1px 8px; min-height:0; }
  /* 動作列釘在底部：按鈕原本在清單下方，捲不到就找不到下一步 */
  /* 右側留白避開解釋卡的浮動按鈕，否則最後一顆鈕會被蓋住 */
  .pgen-actions { position:sticky; bottom:0; z-index:20; margin-bottom:0;
                  padding-right:70px; box-shadow:0 -6px 16px rgba(15,23,42,.08); }
  .pgen-actions .prep-selection-actions { flex-wrap:wrap; }
  .pgen-draft .prep-selection-actions { flex-wrap:wrap; padding-right:70px; }
  .pgen-step { font-size:13px; color:var(--muted); margin:0 0 8px; }
  .pgen-step b { color:var(--blue); }
  .pgen-chip-thin { opacity:.55; border-style:dashed; }
  .pgen-draft { margin-top:12px; }
  .pgen-sec-title { font-weight:700; margin:14px 0 6px; }
  .pgen-group-title { font-weight:600; margin:8px 0 4px 8px; font-size:14px; }
  .pgen-note { font-size:13px; color:#64748b; margin:2px 0 6px; line-height:1.5; }
  .pgen-item { display:flex; gap:8px; align-items:flex-start; margin:0 0 6px 8px; }
  .pgen-input { flex:1 1 auto; min-width:0; font:inherit; padding:6px 8px; border:1px solid var(--line);
                    border-radius:6px; resize:vertical; min-height:36px; }
  .pgen-ans { flex:0 0 auto; font-size:13px; color:#0f766e; padding-top:8px; white-space:nowrap; }
  .pgen-ans-bank { color:#15803d; font-weight:600; }
  .pgen-warn { color:#b91c1c; font-size:13px; margin:8px 0; min-height:18px; }
  @media (max-width:640px) {
    .pgen-item { flex-direction:column; gap:2px; }
    .pgen-ans { padding-top:0; }
  }
  .prep-char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; }
  .prep-char-card { min-height:92px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
                    display:flex; flex-direction:column; align-items:stretch; justify-content:space-between; overflow:hidden; }
  .prep-char-card:hover, .prep-char-card.selected { border-color:var(--blue); background:#eff6ff; color:#1d4ed8; }
  .prep-char-card.taught { border-color:#cbd5e1; background:#f1f5f9; color:#64748b; }
  .prep-char-card.selected { border-color:var(--blue); background:#dbeafe; color:#1d4ed8; }
  .prep-char-select { flex:1; min-height:58px; border:0; background:transparent; color:inherit; cursor:pointer;
                      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .prep-char-card strong { font-size:1.7rem; line-height:1; }
  .prep-char-card small { color:var(--muted); font-size:.72rem; }
  .prep-char-wrap { display:inline-flex; align-items:stretch; margin:2px; }
  .prep-char-wrap .prep-char { margin:0; border-radius:999px 0 0 999px; }
  .prep-char.taught { background:#f1f5f9; border-color:#cbd5e1; color:#64748b; }
  .prep-char.selected { background:#dbeafe; border-color:var(--blue); color:#1d4ed8; font-weight:700; }
  .taught-action { min-height:42px; padding:5px 8px; border:1px solid #cbd5e1; background:#fff; color:#475569;
                   font-size:.72rem; cursor:pointer; }
  .prep-char-card .taught-action { border-width:1px 0 0; }
  .prep-char-wrap .taught-action { border-left:0; border-radius:0 999px 999px 0; }
  .taught-action.is-taught { background:#e2e8f0; color:#475569; font-weight:700; }
  .prep-taught-progress { display:flex; align-items:center; justify-content:space-between; gap:8px;
                          margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); color:var(--muted); }
  #btnTaught { display:block; min-height:42px; margin:10px auto 0; }
  #btnTaught.is-taught { background:#e2e8f0; color:#334155; border-color:#94a3b8; }
  .prep-selection-heading, .queue-heading { display:flex; align-items:baseline; gap:10px; }
  .prep-selection-heading span, .queue-heading span { color:var(--muted); font-size:.82rem; }
  .prep-selection-chars, .queue-chars { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 4px; min-height:34px; align-items:center; }
  .prep-selection-empty { color:var(--muted); font-size:.85rem; }
  .prep-selection-actions, .queue-controls { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  #queueNav { border-color:#93c5fd; background:#eff6ff; }
  .queue-heading strong { color:#1d4ed8; }
  .queue-char { min-width:48px; min-height:42px; padding:5px 10px; border:1px solid #93c5fd; border-radius:8px;
                background:#fff; color:#1e40af; cursor:pointer; }
  .queue-char.active { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700; }
  /* 字卡列固定單列橫向滑動：導覽高度不隨選字數增加 */
  .queue-chars { flex-wrap:nowrap; overflow-x:auto; }
  .queue-char { flex:0 0 auto; }
  /* ID 的 specificity 高於 .hidden，故以 :not(.hidden) 保留載入中／錯誤狀態隱藏 */
  @media (min-width:900px) {
    #app:not(.hidden) { display:grid; grid-template-columns:minmax(260px,320px) 1fr;
                        gap:12px; align-items:start; }
    #boardSide { position:sticky; top:56px; }  /* #modeTabs 實高約 50px */
    #boardMain { min-width:0; }                 /* 避免長來源標籤撐出整頁水平捲軸 */
  }
  #view-projector { position:fixed; inset:0; background:radial-gradient(circle at 50% 30%,#1e3a5f 0,#0f172a 58%); color:#fff; z-index:50;
                    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:92px 40px 40px; overflow:auto; }
  #view-projector.hidden { display:none; }
  .projchar { font-family:DFKai-SB,"BiauKai","Microsoft JhengHei",serif; font-size:clamp(7rem,18vw,12rem); font-weight:700; line-height:1.1; text-shadow:0 10px 40px rgba(0,0,0,.35); }
  .projlabel { font-size:1.15rem; color:#93c5fd; margin:14px 0 20px; letter-spacing:.08em; }
  .projbody { font-size:clamp(1.25rem,2.5vw,1.8rem); max-width:950px; text-align:center; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; line-height:1.75; }
  .projbody .chip { font-size:1.25rem; cursor:default; }
  .projbody.projexplain { display:block; text-align:left; }
  .projexplain-part { white-space:pre-line; margin:0 0 16px; }
  .projexplain-part:last-child { margin-bottom:0; }
  .projwrite { display:flex; gap:6px; margin:6px 12px; flex-wrap:wrap; }
  .projcell-wrap { position:relative; width:64px; height:64px; border:2px solid #64748b; cursor:pointer; background-color:#fff;
                   background-image:linear-gradient(to right,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%); }
  .projcell-wrap.projgap { margin-left:12px; }
  .projcell-guide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
                     font-family:DFKai-SB,"BiauKai","Microsoft JhengHei",serif; font-size:1.8rem; }
  .projcell-wrap.trace .projcell-guide { color:#9aa5b1; }
  .projcell-wrap.faint .projcell-guide { color:#dfe4ea; }
  .projcell-wrap.blank .projcell-guide { color:transparent; }
  .projcell-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .projcontrols { display:flex; gap:12px; margin-top:28px; }
  .projbtn { padding:9px 18px; border:1px solid #64748b; border-radius:999px; color:#e2e8f0; background:#1e293b; cursor:pointer; }
  .projbtn:disabled { opacity:.35; cursor:not-allowed; }
  .projempty { font-size:1.4rem; color:#cbd5e1; }
  .write-row-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; }
  .write-row-heading .wlabel { font-weight:700; font-size:1rem; }
  .write-clear { padding:4px 9px; font-size:.78rem; }
  .wcells.screen-cells { display:flex; flex-wrap:wrap; gap:8px; }
  .wcanvasWrap { position:relative; flex:0 0 96px; width:96px; height:96px; border:1px solid #94a3b8;
                 background-color:#fff; background-image:linear-gradient(to right,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%); }
  .wcanvasWrap.wgap { margin-left:16px; }
  .wcanvasWrap .wguide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.65rem; pointer-events:none; }
  .wcanvasWrap.trace .wguide { color:#9aa5b1; }
  .wcanvasWrap.faint .wguide { color:#dfe4ea; }
  .wcanvasWrap.blank .wguide { color:transparent; }
  .wcanvas { position:absolute; inset:0; width:96px; height:96px; touch-action:none; cursor:crosshair; }
  .writable { display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:10px 0 16px; border-bottom:1px solid #e2e8f0; }
  .writable:last-child { border-bottom:0; }
  .write-empty { color:var(--muted); font-size:.9rem; padding:8px 0; }
  .wcanvasWrap { cursor:pointer; }
  .write-modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.72); z-index:80;
                           display:flex; align-items:center; justify-content:center; padding:20px; }
  .write-modal-card { background:#fff; border-radius:16px; padding:20px; display:flex; flex-direction:column;
                       align-items:center; gap:14px; max-width:96vw; max-height:96vh; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .write-modal-title { font-size:1.1rem; font-weight:700; color:#1e293b; }
  .write-modal-canvas-wrap { position:relative; width:min(72vw,60vh); aspect-ratio:1/1; border:1px solid #94a3b8; background-color:#fff;
    background-image:linear-gradient(to right,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%); }
  .write-modal-canvas-wrap .wguide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; font-size:min(40vw,32vh); }
  .write-modal-canvas-wrap.trace .wguide { color:#9aa5b1; }
  .write-modal-canvas-wrap.faint .wguide { color:#dfe4ea; }
  .write-modal-canvas-wrap.blank .wguide { color:transparent; }
  .write-modal-canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .write-modal-actions { display:flex; gap:12px; }
  .write-mode-toggle { display:flex; align-items:center; gap:6px; font-size:.9rem; color:var(--muted); margin:0 0 10px; cursor:pointer; }
  .write-modal-word-cells { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:90vw; }
  .write-modal-cell-wrap { position:relative; width:min(22vw,160px); aspect-ratio:1/1; border:1px solid #94a3b8; background-color:#fff;
    background-image:linear-gradient(to right,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,#e2e8f0 49.5%,#e2e8f0 50.5%,transparent 50.5%); }
  .write-modal-cell-wrap.wgap { margin-left:16px; }
  .write-modal-cell-wrap .wguide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; font-size:min(10vw,70px); }
  .write-modal-cell-wrap.trace .wguide { color:#9aa5b1; }
  .write-modal-cell-wrap.faint .wguide { color:#dfe4ea; }
  .write-modal-cell-wrap.blank .wguide { color:transparent; }
  .write-modal-cell-canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  @media (max-width:700px) { .prep-filters { grid-template-columns:1fr; } }

  /* ── 練習紙預覽與列印 ──────────────────────────────── */
  #printSheet { display:none; }
  #printPreview { position:fixed; inset:0; z-index:100; overflow:auto; padding:18px; background:rgba(15,23,42,.78); }
  .print-preview-card { max-width:1120px; margin:0 auto; background:#e2e8f0; border-radius:14px; padding:14px; }
  .print-preview-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 4px 14px; }
  .print-preview-toolbar strong { font-size:1.1rem; }
  .print-preview-toolbar label { display:flex; align-items:center; gap:4px; color:var(--muted); font-size:.85rem; }
  .print-preview-toolbar input, .print-preview-toolbar select { min-height:34px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  #printLesson { width:110px; }
  #printClass { width:78px; }
  #printSummary { color:var(--muted); font-size:.82rem; }
  #printWarning { flex:1 1 100%; color:#166534; font-size:.78rem; }
  #printWarning.warning { color:#b45309; }
  .print-preview-pages { display:flex; flex-direction:column; align-items:center; gap:18px; overflow:auto; }
  .practice-page { position:relative; width:210mm; min-height:297mm; padding:8mm 1mm 9mm; background:#fff; box-shadow:0 4px 18px rgba(15,23,42,.18); }
  .practice-page::after { content:'第 ' var(--page-num,1) ' 頁 / 共 ' var(--total-pages,1) ' 頁'; position:absolute; left:0; right:0; bottom:4mm; text-align:center; color:#777; font-size:7pt; }
  .practice-header { display:flex; flex-direction:column; align-items:center; gap:2mm; margin-bottom:5mm; }
  .practice-title { margin:0; font-size:14pt; letter-spacing:1px; }
  .practice-fields { display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:3mm 5mm; font-size:9pt; color:#333; }
  .practice-field-value { display:inline-block; min-width:24mm; border-bottom:1px solid #888; min-height:1.1em; color:#1a4a1a; }
  .practice-field-value.short { min-width:16mm; }
  .practice-field-blank { display:inline-block; min-width:22mm; border-bottom:1px solid #888; height:1.1em; }
  .practice-field-blank.number { min-width:13mm; }
  .practice-grid { display:grid; grid-template-columns:repeat(6,30.5mm); justify-content:center; column-gap:4mm; align-items:start; }
  .practice-column { display:flex; flex-direction:column; gap:2mm; }
  .practice-item { break-inside:avoid; page-break-inside:avoid; display:flex; flex-direction:column; align-items:center; }
  .practice-slot { display:table; table-layout:fixed; width:30.5mm; border-collapse:collapse; }
  .practice-slot + .practice-slot { margin-top:-4px; }
  .practice-box { width:23mm; height:23mm; display:table-cell; position:relative; vertical-align:middle; text-align:center; border:0.96mm solid #6fa27a;
                  font-size:2.9rem; line-height:1; color:#222; background:#fff;
                  background-image:linear-gradient(to right,transparent 49.7%,#b8d2b8 49.7%,#b8d2b8 50.3%,transparent 50.3%),linear-gradient(to bottom,transparent 49.7%,#b8d2b8 49.7%,#b8d2b8 50.3%,transparent 50.3%),linear-gradient(45deg,transparent 49.5%,#d6e3d6 49.5%,#d6e3d6 50.5%,transparent 50.5%),linear-gradient(-45deg,transparent 49.5%,#d6e3d6 49.5%,#d6e3d6 50.5%,transparent 50.5%); }
  .practice-box.blank { color:transparent; }
  .practice-bopo { width:7.5mm; height:23mm; display:table-cell; vertical-align:middle; text-align:center; border:.96mm solid #6fa27a; border-left:none; background:#fff; }
  .practice-bopo.empty { color:transparent; }
  .practice-bopo-inner { display:inline-grid; grid-template-columns:1em .7em; column-gap:.02em; align-items:start; justify-items:center; font-family:"Microsoft JhengHei","Noto Sans Bopomofo","Bpmf Zihi Sans",sans-serif; font-size:10pt; font-weight:600; line-height:1; }
  .practice-bopo-stack { display:grid; grid-auto-rows:1em; row-gap:.08em; align-items:center; justify-items:center; }
  .practice-bopo-symbol { display:block; min-width:1em; min-height:1em; line-height:1; }
  .practice-bopo-tone { display:block; min-width:.7em; font-size:1.22em; font-weight:800; line-height:1; text-align:center; transform:translate(.03em,var(--tone-offset,0)); }
  .practice-bopo-light { display:block; grid-column:1/-1; text-align:center; font-weight:800; line-height:.55; margin-bottom:.04em; }

  @media print {
    header, main, #basket, #status, #modeTabs, #view-prep, #view-practice, #view-projector, #printPreview { display:none !important; }
    body { background:#fff; }
    #printSheet { display:block; }
    @page { size:A4; margin:0; }
    .practice-page { box-shadow:none; page-break-after:always; break-after:page; }
    .practice-page:last-child { page-break-after:auto; break-after:auto; }
    .practice-box, .practice-bopo { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

<nav aria-label="學扶備課系統切換" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;justify-content:center;padding:8px 14px;background:#eef2f0;border-bottom:1px solid #d9e0dc;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:13.5px;line-height:1.4;">

<header>
  <h1>🔤 字主板</h1>
  <input id="kw" placeholder="輸入一個字…" maxlength="1">
  <button class="btn" id="btnSearch">查</button>
  <select id="grade">
    <option>三年級</option><option>四年級</option><option>五年級</option><option>六年級</option>
  </select>
  <span style="flex:1"></span>
  <a href="index.html" class="btn" style="text-decoration:none">← 備課搜尋</a>
  <a href="class.html" class="btn" style="text-decoration:none">課堂講義</a>
</header>

<nav id="modeTabs" aria-label="字主板模式">
  <button class="tab" data-mode="prep" aria-selected="false">📋 備課台</button>
  <button class="tab active" data-mode="board" aria-selected="true">🔤 字主板</button>
  <button class="tab" data-mode="practice" aria-selected="false">📝 產練習卷</button>
  <button class="tab" data-mode="projector" aria-selected="false">📽 投影</button>
</nav>

<section id="view-board">
  <div id="status">載入題庫中…</div>

  <main id="app" class="hidden">
    <div id="boardSide">
      <div id="queueNav" class="panel hidden"></div>
      <div class="panel">
        <div class="bigchar" id="bigChar">—</div>
        <div class="charmeta" id="charMeta"></div>
        <button class="btn hidden" id="btnTaught" aria-pressed="false">標記已教</button>
      </div>
    </div>

    <div id="boardMain">
      <div class="panel" id="optionPanel">
        <h2>選項詞（點一下丟進詞籃）</h2>
        <div id="optionWords"></div>
      </div>

      <div class="panel">
        <h2>補充詞（題庫＋康軒／翰林／南一 1–6 年級，點一下丟進詞籃）</h2>
        <div id="supWords"></div>
        <button class="btn hidden" id="btnMore"></button>
      </div>

      <div class="panel">
        <h2>考過的題（點一下設為教學情境）</h2>
        <div id="questions"></div>
      </div>

      <div class="panel">
        <h2>螢幕手寫</h2>
        <div id="writeBoard"></div>
      </div>
    </div>
  </main>
</section>

<section id="view-prep" class="hidden"></section>
<section id="view-practice" class="hidden"></section>
<section id="view-projector" class="hidden"></section>

<div id="printPreview" class="hidden" role="dialog" aria-modal="true" aria-labelledby="printPreviewTitle">
  <div class="print-preview-card">
    <div class="print-preview-toolbar">
      <strong id="printPreviewTitle">列印練習紙</strong>
      <span id="printSummary"></span>
      <label>版本
        <select id="printMode"><option value="fill">填空版</option><option value="answer">答案版</option></select>
      </label>
      <label>課別<input id="printLesson" type="text" maxlength="30" placeholder="可留白"></label>
      <label>班級<input id="printClass" type="text" maxlength="20" placeholder="可留白"></label>
      <button class="btn" id="btnClosePrintPreview">關閉</button>
      <button class="btn btn-primary" id="btnPrintPreview">列印</button>
      <span id="printWarning"></span>
    </div>
    <div id="printPreviewPages" class="print-preview-pages"></div>
  </div>
</div>
<div id="printSheet"></div>

<div id="basket" class="hidden">
  <strong>🧺 詞籃 <span id="basketCount">0</span></strong>
  <span id="basketItems"></span>
  <button class="btn btn-primary" id="btnWordApplication" disabled>✏️ 語詞應用</button>
  <button class="btn btn-primary" id="btnPrint">🖨 列印練習紙</button>
  <button class="btn" id="btnClear">清除全部資料</button>
</div>

<div id="waOverlay" class="wa-overlay hidden" aria-hidden="true">
  <section id="waDialog" class="wa-dialog" role="dialog" aria-modal="true" aria-labelledby="waTitle">
    <header class="wa-header">
      <h2 id="waTitle" tabindex="-1">語詞應用</h2>
      <button class="btn wa-close" id="waClose" type="button" aria-label="關閉語詞應用">×</button>
    </header>
    <div class="wa-body">
      <fieldset class="wa-terms">
        <legend>選擇要使用的完整詞語</legend>
        <div id="waTermChoices"></div>
        <p id="waTermError" class="wa-error" role="status"></p>
      </fieldset>
      <div class="wa-settings">
        <label>年段
          <select id="waLevel">
            <option value="low">低年級</option>
            <option value="middle" selected>中年級</option>
            <option value="high">高年級</option>
          </select>
        </label>
        <label>形式
          <select id="waMode">
            <option value="passage" selected>短文</option>
            <option value="sentences">造句</option>
          </select>
        </label>
        <button class="btn btn-primary" id="waGenerate" type="button">生成應用內容</button>
      </div>
      <p id="waStatus" class="wa-status" role="status" aria-live="polite"></p>
      <section id="waResult" class="wa-result hidden">
        <div class="wa-version-tabs" role="tablist" aria-label="內容版本">
          <button id="waTeacherTab" type="button" role="tab" aria-selected="true">教師版</button>
          <button id="waStudentTab" type="button" role="tab" aria-selected="false">學生版</button>
        </div>
        <article id="waOutput" aria-live="polite"></article>
        <details id="waDictionary">
          <summary>讀音與詞義</summary>
          <div id="waDictionaryBody"></div>
        </details>
        <div class="wa-actions">
          <button class="btn" id="waPrint" type="button">列印</button>
          <button class="btn btn-primary" id="waRegenerate" type="button">重新生成</button>
        </div>
      </section>
    </div>
  </section>
</div>
<section id="waPrintSheet" class="wa-print-sheet" aria-hidden="true"></section>
